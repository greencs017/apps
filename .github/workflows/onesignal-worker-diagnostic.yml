name: Diagnóstico público de OneSignal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/onesignal-worker-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar archivo remoto de OneSignal sin credenciales
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1" url="$2" expected="$3"
            local body hdr status ctype
            body="$(mktemp)"; hdr="$(mktemp)"
            echo "===== $name ====="
            status="$(curl -sSL --connect-timeout 10 --max-time 35 -D "$hdr" -o "$body" -w '%{http_code}' -H 'Cache-Control: no-cache' "$url")"
            ctype="$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' || true)"
            echo "HTTP: $status"
            echo "Content type: $ctype"
            echo "Bytes: $(wc -c < "$body")"
            echo "Primeros 180 caracteres:"
            head -c 180 "$body" | tr '\n' ' '
            echo
            test "$status" = "200"
            grep -Fq "$expected" "$body"
            grep -qiE 'javascript|ecmascript|text/plain' <<<"$ctype"
          }
          check "Service worker GitHub Pages" "https://greencs017.github.io/apps/OneSignalSDKWorker.js?appId=0956c8db-37fb-4a11-98bd-397d121ae8fa&sdkVersion=160700" "importScripts("
          check "SDK del service worker OneSignal" "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.sw.js" "OneSignal"
          check "Lanzador Simulador" "https://greencs017.github.io/apps/simulador-remuneraciones/" "access-bridge.js?v=20261106-shared-worker-apps1"
          echo "OK: las rutas públicas entregan contenido"
