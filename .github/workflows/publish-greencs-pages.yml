name: Publicar aplicaciones GreenCS017 en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-greencs-pages.yml'
      - 'index.html'
      - 'access-bridge.js'
      - 'install-guide.js'
      - 'OneSignalSDKWorker.js'
      - 'escalafon-online/**'
      - 'revisor-cargo-fiscal/**'
      - 'simulador-remuneraciones/**'
      - 'gastos/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: greencs017-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código público
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar worker y preparar solo archivos públicos
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/access-bridge.test.cjs tests/onesignal-shared-worker.test.cjs
          grep -Fq "importScripts(" OneSignalSDKWorker.js
          test -f index.html
          mkdir -p _site
          cp .nojekyll index.html ./*.js _site/
          for dir in escalafon-online revisor-cargo-fiscal simulador-remuneraciones gastos; do
            cp -R "$dir" "_site/$dir"
          done
          test -f _site/OneSignalSDKWorker.js
          echo "Se prepara la publicación de: $(find _site -type f | wc -l) archivos públicos"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar URL de despliegue
        run: |
          echo "GitHub Pages: ${{ steps.deployment.outputs.page_url }}"
